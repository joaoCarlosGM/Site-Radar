<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Transponder | Core Eletrônica</title>
    <style>
        /* Registro de variáveis para Geometria Perfeita do Leque */
        @property --fan-top { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
        @property --fan-bottom { syntax: '<angle>'; inherits: false; initial-value: 360deg; }

        /* Variáveis de Tema (Noite Escura / Pré-Amanhecer) */
        :root {
            --sky-color: #020617; 
            --fog-color: rgba(2, 6, 23, 0.95);
            --water-color: #080f1e;
            --text-color: #f8fafc;
            --primary: #2563eb;
            --input-bg: rgba(255, 255, 255, 0.05);
            --danger: #ef4444;
            --beam-opacity: 0.8;
        }

        body.dawn {
            --sky-color: #172554; 
            --fog-color: rgba(23, 37, 84, 0.8);
            --water-color: #0f172a;
            --text-color: #f8fafc;
            --primary: #38bdf8;
            --input-bg: rgba(255, 255, 255, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }

        body { background-color: var(--sky-color); color: var(--text-color); height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: background-color 4s ease; }

        /* =========================================
           TELA DE INÍCIO (DESTRAVA O ÁUDIO)
           ========================================= */
        .start-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: var(--sky-color); z-index: 999999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.5s ease;
        }
        .start-screen h1 { font-size: 2.5rem; margin-bottom: 10px; color: #fff; letter-spacing: -1px; }
        .start-screen p { font-size: 1rem; color: #94a3b8; margin-bottom: 40px; }
        .btn-start { background: var(--primary); color: #fff; border: none; padding: 15px 40px; border-radius: 30px; font-size: 1.2rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); animation: pulse 2s infinite; }
        .btn-start:hover { transform: translateY(-2px); filter: brightness(1.1); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }

        /* =========================================
           CONTROLE DE ÁUDIO GLOBAL
           ========================================= */
        .audio-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 100002;
            background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px; border-radius: 50%; width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; opacity: 0; transition: opacity 1s, background 0.3s;
            font-size: 1.2rem;
        }
        .audio-toggle:hover { background: rgba(0,0,0,0.6); }
        .audio-toggle.visible { opacity: 1; }
        .audio-toggle.muted::after {
            content: ''; position: absolute; width: 25px; height: 2px;
            background: var(--danger); transform: rotate(45deg);
        }

        /* =========================================
           CAIXA DE VIDRO (FIX MOBILE)
           ========================================= */
        .scene-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; pointer-events: none; z-index: 1;
        }

        /* =========================================
           TEXTOS INICIAIS
           ========================================= */
        .text-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            z-index: 100001; 
        }
        
        .intro-text {
            position: absolute; font-size: 3.5rem; font-weight: 900; color: #3758ef; letter-spacing: -2px;
            opacity: 0; transform: translateY(15px); transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .intro-text.visible { opacity: 1; transform: translateY(0); }

        /* =========================================
           CENÁRIO
           ========================================= */
        .ocean { position: absolute; bottom: 0; left: 0; width: 100%; height: 40vh; background: var(--water-color); z-index: 1; transition: background-color 4s ease; }
        .fog-horizon { position: absolute; bottom: 35vh; left: 0; width: 100%; height: 25vh; background: linear-gradient(to bottom, transparent, var(--fog-color) 80%, var(--water-color)); z-index: 3; transition: background 4s ease; }
        .coastline-container { position: absolute; bottom: 40vh; left: 0; width: 100%; height: 30px; z-index: 2; }
        .coastline { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
        .coastline-reflection { position: absolute; top: 100%; left: 0; width: 100%; height: 100%; transform: scaleY(-1); opacity: 0.25; filter: blur(3px); }
        .house { position: absolute; bottom: 0; color: #070d1a; transition: color 4s; }
        body.dawn .house { color: #0b132b; } 
        .light { position: absolute; bottom: 5px; width: 3px; height: 3px; background: #fde047; border-radius: 50%; box-shadow: 0 0 6px 2px rgba(253, 224, 71, 0.8); }
        @keyframes flicker { 0%, 100% { opacity: 0.9; } 33% { opacity: 0.5; } 66% { opacity: 0.8; } 80% { opacity: 0.4; } }

        /* =========================================
           BARCO E MÁQUINA DE LUZ
           ========================================= */
        .fleet-container { position: absolute; bottom: 10vh; left: 0; width: 100%; height: 30vh; z-index: 5; }
        .boat-wrapper { position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%); }
        .boat-bobbing { position: relative; transform-origin: center bottom; animation: bobbing 4s ease-in-out infinite alternate; }
        @keyframes bobbing { 0% { transform: translateY(0px) rotate(-1deg); } 100% { transform: translateY(12px) rotate(2deg); } }
        
        .white-fan {
            position: absolute; left: 193px; top: 8px;
            width: 250vmax; height: 250vmax; border-radius: 50%; 
            transform: translate(-50%, -50%); background: #ffffff;
            -webkit-mask-image: conic-gradient(from 270deg, transparent 0deg, transparent var(--fan-top), black var(--fan-top), black var(--fan-bottom), transparent var(--fan-bottom), transparent 360deg);
            mask-image: conic-gradient(from 270deg, transparent 0deg, transparent var(--fan-top), black var(--fan-top), black var(--fan-bottom), transparent var(--fan-bottom), transparent 360deg);
            transition: --fan-top 2s cubic-bezier(0.7, 0, 0.2, 1), --fan-bottom 2s cubic-bezier(0.7, 0, 0.2, 1), opacity 1s ease; 
            z-index: 10000;
        }
        .white-fan.closing { --fan-top: 163deg; --fan-bottom: 197deg; }
        .fade-to-radar .white-fan { opacity: 0; }

        .searchlight-beam {
            transform-origin: 193px 8px; opacity: 0; mix-blend-mode: screen; transition: opacity 1s ease; transform: rotate(0deg); 
        }
        .fade-to-radar .searchlight-beam { opacity: 1; }
        .active-radar .searchlight-beam { animation: sweeping 6s infinite ease-in-out; }
        @keyframes sweeping { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } }

        /* =========================================
           FORMULÁRIO (MÁQUINA DE ESTADOS)
           ========================================= */
        .form-container { position: relative; z-index: 20; width: 100%; max-width: 400px; padding: 20px; text-align: center; opacity: 0; transform: translateY(20px); transition: opacity 1.5s ease, transform 1.5s ease; pointer-events: none; }
        .form-container.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
        
        .form-header { margin-bottom: 40px; opacity: 1; transition: opacity 1s; }
        .form-header h1 { font-size: 2rem; font-weight: 800; letter-spacing: -1px; margin-bottom: 10px;}
        .form-header p { font-size: 1rem; opacity: 0.7; }

        .step-wrapper { position: relative; height: 120px; width: 100%; overflow: hidden; }
        .form-step { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transform: translateX(50px); pointer-events: none; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .form-step.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
        .form-step.exit-left { opacity: 0; transform: translateX(-50px); pointer-events: none; }
        .form-step.exit-right { opacity: 0; transform: translateX(50px); pointer-events: none; }

        label { font-size: 0.9rem; font-weight: 600; margin-bottom: 15px; display: block; text-transform: uppercase; letter-spacing: 1px; color: var(--primary);}
        input { width: 100%; padding: 15px 20px; font-size: 16px; text-align: center; background: var(--input-bg); border: 2px solid transparent; border-bottom: 2px solid var(--primary); color: var(--text-color); border-radius: 8px 8px 0 0; outline: none; transition: 0.3s; }
        input:focus { background: rgba(255,255,255,0.1); border-bottom-color: #38bdf8; }
        .input-error { border-bottom-color: var(--danger) !important; background: rgba(239, 68, 68, 0.1) !important; }

        .btn-controls { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; }
        .btn-icon { background: none; border: none; color: var(--text-color); font-size: 1rem; cursor: pointer; opacity: 0.5; transition: 0.2s; display: flex; align-items: center; gap: 5px; }
        .btn-icon:hover { opacity: 1; }
        .btn-next { background: var(--primary); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);}
        .btn-next:hover { transform: translateY(-2px); filter: brightness(1.1); }

        .summary-box { background: var(--input-bg); padding: 20px; border-radius: 12px; text-align: left; width: 100%; font-size: 0.95rem; line-height: 1.8; margin-bottom: 15px;}
        .summary-box span { font-weight: 700; color: var(--primary); }

        #success-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; opacity: 0; pointer-events: none; transition: opacity 2s; z-index: 30;}
        #success-msg h2 { font-size: 2.5rem; color: #ffffff; margin-bottom: 10px;}
        #success-msg p { color: #94a3b8; font-size: 1.2rem;}
        body.dawn #success-msg { opacity: 1; transition-delay: 2s; }
    </style>
</head>
<body>

    <div class="start-screen" id="start-screen">
        <h1>Transponder</h1>
        <p>Bem-vindo à rede de segurança.</p>
        <button id="btn-start" class="btn-start">Embarcar</button>
    </div>

    <button class="audio-toggle" id="btn-audio" title="Ativar/Desativar Instruções por Voz">🔊</button>

    <div class="scene-wrapper">
        <div class="text-overlay">
            <div class="intro-text" id="text-ola">Transponder</div>
            <div class="intro-text" id="text-vamos">Vamos Lá!</div>
        </div>

        <div class="coastline-container">
            <div class="coastline" id="coastline-real"></div>
            <div class="coastline-reflection" id="coastline-reflex"></div>
        </div>

        <div class="fog-horizon"></div>
        <div class="ocean"></div>

        <div class="fleet-container" id="fleet">
            <div class="boat-wrapper" id="main-boat" style="z-index: 100;">
                <div class="boat-bobbing">
                    <div class="white-fan" id="white-fan"></div>

                    <svg viewBox="0 0 200 60" width="200" height="60" style="overflow: visible; display: block;">
                        <defs>
                            <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                                <stop offset="0%" stop-color="rgba(255, 255, 255, var(--beam-opacity))" />
                                <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
                            </linearGradient>
                        </defs>
                        <polygon id="searchlight" points="193,8 1714,-466 1714,482" fill="url(#beam-grad)" class="searchlight-beam" />
                        <rect x="5" y="15" width="18" height="25" fill="#334155" rx="3"/>
                        <rect x="8" y="10" width="12" height="5" fill="#cbd5e1" rx="1"/>
                        <path d="M10,40 L18,40 L18,55 L10,55 Z" fill="#0f172a"/>
                        <path d="M25,20 L160,20 L195,8 L170,40 L35,40 Z" fill="#3b82f6"/> 
                        <path d="M25,20 L160,20 L170,40 L35,40 Z" fill="#2563eb"/> 
                        <circle cx="193" cy="8" r="3" fill="#ffffff" />
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <div id="success-msg">
        <h2>Tudo Certo!</h2>
        <p>Sua embarcação agora faz parte da rede.</p>
    </div>

    <div class="form-container" id="form-container">
        <div class="form-header">
            <h1>Transponder</h1>
            <p>Conectando os rios da Amazônia</p>
        </div>

        <div class="step-wrapper">
            <div class="form-step active" data-step="0">
                <label>Como podemos te chamar?</label>
                <input type="text" id="inp_nome" placeholder="Seu nome completo" autocomplete="off">
            </div>
            <div class="form-step" data-step="1">
                <label>Qual o seu Celular/WhatsApp?</label>
                <input type="tel" id="inp_celular" placeholder="(00) 00000-0000" autocomplete="off" maxlength="15">
            </div>
            <div class="form-step" data-step="2">
                <label>Qual o seu E-mail?</label>
                <input type="email" id="inp_email" placeholder="seu@email.com" autocomplete="email">
            </div>
            <div class="form-step" data-step="3">
                <label>Qual o CEP da sua Comunidade?</label>
                <input type="text" id="inp_cep" placeholder="00000-000" autocomplete="off" maxlength="9">
            </div>
            <div class="form-step" data-step="4">
                <div class="summary-box">
                    Nome: <span id="sum_nome"></span><br>
                    Celular: <span id="sum_celular"></span><br>
                    E-mail: <span id="sum_email"></span><br>
                    CEP: <span id="sum_cep"></span>
                </div>
            </div>
        </div>

        <div class="btn-controls">
            <button class="btn-icon" id="btn-back" style="visibility: hidden;">&#8592; Voltar</button>
            <button class="btn-next" id="btn-next">Avançar</button>
        </div>
    </div>

    <script>
        const sleep = ms => new Promise(res => setTimeout(res, ms));

        // ==========================================
        // GERENCIADOR DE ÁUDIO E VOZ
        // ==========================================
        const audioPlayer = new Audio();
        let audioHabilitado = true; 
        const btnAudio = document.getElementById('btn-audio');

        const trilhasDeAudio = {
            intro: 'audios/boas_vindas.mp3', 
            0: 'audios/passo_nome.mp3',
            1: 'audios/passo_celular.mp3',
            2: 'audios/passo_email.mp3',
            3: 'audios/passo_cep.mp3',
            4: 'audios/passo_resumo.mp3',
            sucesso: 'audios/sucesso.mp3' 
        };

        btnAudio.addEventListener('click', () => {
            audioHabilitado = !audioHabilitado;
            if(audioHabilitado) {
                btnAudio.classList.remove('muted');
                if(document.getElementById('form-container').classList.contains('visible')) {
                    tocarInstrucao(currentStep);
                }
            } else {
                btnAudio.classList.add('muted');
                audioPlayer.pause();
            }
        });

        function tocarInstrucao(chave) {
            if(!audioHabilitado || !trilhasDeAudio[chave]) return;
            audioPlayer.src = trilhasDeAudio[chave];
            audioPlayer.play().catch(e => console.log("Áudio bloqueado."));
        }

        gerarCenarioCosta();

        // ==========================================
        // ORQUESTRAÇÃO CINEMATOGRÁFICA (VIA CLIQUE)
        // ==========================================
        document.getElementById('btn-start').addEventListener('click', async () => {
            const startScreen = document.getElementById('start-screen');
            const mainBoat = document.getElementById('main-boat');
            const whiteFan = document.getElementById('white-fan');
            const textOla = document.getElementById('text-ola');
            const textVamos = document.getElementById('text-vamos');
            const form = document.getElementById('form-container');

            startScreen.style.opacity = '0';
            setTimeout(() => startScreen.style.display = 'none', 500);

            tocarInstrucao('intro');

            await sleep(400);
            textOla.classList.add('visible');
            await sleep(1000);
            textOla.classList.remove('visible');
            await sleep(400);
            textVamos.classList.add('visible');
            await sleep(1000);
            textVamos.classList.remove('visible');
            
            await sleep(300);
            whiteFan.classList.add('closing');
            
            btnAudio.classList.add('visible');
            
            await sleep(2000); 
            mainBoat.classList.add('fade-to-radar');
            
            await sleep(1000); 
            mainBoat.classList.add('active-radar');
            
            form.classList.add('visible');
            setTimeout(() => {
                document.getElementById('inp_nome').focus();
                tocarInstrucao(0); 
            }, 800);
        });

        function gerarCenarioCosta() {
            const costaReal = document.getElementById('coastline-real');
            const costaReflexo = document.getElementById('coastline-reflex');
            let htmlCenario = '';
            let leftPos = 0;
            while (leftPos < 100) {
                let w = Math.random() * 4 + 3; 
                let h = Math.random() * 15 + 10;
                let tipo = Math.random();
                let poly = "0,40 50,0 100,40 100,100 0,100"; 
                if(tipo > 0.6) poly = "0,20 100,20 100,100 0,100"; 
                if(tipo > 0.8) poly = "0,0 40,20 100,0 100,100 0,100"; 
                htmlCenario += `<div class="house" style="left: ${leftPos}%; width: ${w + 0.5}%; height: ${h+10}px;"><svg viewBox="0 0 100 100" preserveAspectRatio="none" width="100%" height="100%"><polygon points="${poly}" fill="currentColor" /></svg></div>`;
                if (Math.random() > 0.2) { 
                    let numLuzes = Math.random() > 0.7 ? 2 : 1;
                    for(let j = 0; j < numLuzes; j++) {
                        let luzLeft = leftPos + (Math.random() * (w * 0.8) + (w * 0.1));
                        let luzBottom = Math.random() * (h * 0.5) + 2;
                        htmlCenario += `<div class="light" style="left: ${luzLeft}%; bottom: ${luzBottom}px; animation: flicker ${Math.random() * 2 + 1.5}s infinite alternate ease-in-out ${Math.random() * 2}s;"></div>`;
                    }
                }
                leftPos += w; 
            }
            costaReal.innerHTML = htmlCenario;
            costaReflexo.innerHTML = htmlCenario; 
        }

        // ==========================================
        // MÁQUINA DE ESTADOS E VALIDAÇÃO
        // ==========================================
        const steps = document.querySelectorAll('.form-step');
        const btnNext = document.getElementById('btn-next');
        const btnBack = document.getElementById('btn-back');
        let currentStep = 0;

        document.getElementById('inp_celular').addEventListener('input', function(e) {
            let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/);
            e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
        });
        document.getElementById('inp_cep').addEventListener('input', function(e) {
            let v = e.target.value.replace(/\D/g, '');
            e.target.value = v.replace(/^(\d{5})(\d)/, "$1-$2");
        });

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('input', () => input.classList.remove('input-error'));
        });

        function validaPassoAtual() {
            const input = steps[currentStep].querySelector('input');
            if(!input) return true; 

            let valor = input.value.trim();
            
            if(valor === '') {
                marcaErro(input);
                return false;
            }

            if(input.type === 'email') {
                const regexEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if(!regexEmail.test(valor)) {
                    marcaErro(input);
                    return false;
                }
            }

            return true;
        }

        function marcaErro(input) {
            input.classList.add('input-error');
            input.focus();
        }

        function goToStep(newStep) {
            if (newStep < 0 || newStep >= steps.length) return;

            steps[currentStep].classList.remove('active');
            if (newStep > currentStep) {
                steps[currentStep].classList.add('exit-left'); 
                steps[newStep].classList.remove('exit-right', 'exit-left');
                steps[newStep].classList.add('active');
            } else {
                steps[currentStep].classList.add('exit-right'); 
                steps[newStep].classList.remove('exit-left', 'exit-right');
                steps[newStep].classList.add('active');
            }
            currentStep = newStep;
            btnBack.style.visibility = currentStep === 0 ? 'hidden' : 'visible';
            
            tocarInstrucao(currentStep);
            
            if (currentStep === steps.length - 1) {
                document.getElementById('sum_nome').innerText = document.getElementById('inp_nome').value || "-";
                document.getElementById('sum_celular').innerText = document.getElementById('inp_celular').value || "-";
                document.getElementById('sum_email').innerText = document.getElementById('inp_email').value || "-";
                document.getElementById('sum_cep').innerText = document.getElementById('inp_cep').value || "-";
                btnNext.innerText = "Confirmar Cadastro";
            } else {
                btnNext.innerText = "Avançar";
                const input = steps[currentStep].querySelector('input');
                if(input) setTimeout(() => input.focus(), 400);
            }
        }

        btnNext.addEventListener('click', () => {
            if (currentStep === steps.length - 1) {
                finalizarExperiencia();
            } else {
                if(validaPassoAtual()) {
                    goToStep(currentStep + 1);
                }
            }
        });

        btnBack.addEventListener('click', () => goToStep(currentStep - 1));

        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('keypress', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    btnNext.click();
                }
            });
        });

        // ==========================================
        // AMANHECER FINAL (CORREÇÃO DA FROTA E BARCO PRINCIPAL)
        // ==========================================
        function finalizarExperiencia() {
            const form = document.getElementById('form-container');
            form.style.opacity = '0';
            form.style.pointerEvents = 'none';
            btnAudio.style.display = 'none'; 

            document.body.classList.add('dawn');
            tocarInstrucao('sucesso');
            
            // Faz o barco principal navegar para fora do ecrã
            const mainBoat = document.getElementById('main-boat');
            if (mainBoat) {
                setTimeout(() => {
                    // Transição linear longa e suave, igual ao resto da frota
                    mainBoat.style.transition = 'left 25s linear'; 
                    mainBoat.style.left = '150vw'; 
                }, 50);
            }

            gerarFrota();
        }

        function gerarFrota() {
            const fleetContainer = document.getElementById('fleet');
            const numBarcos = 15; 
            const paletaCores = ['#0f172a', '#1e3a8a', '#7f1d1d', '#14532d', '#78350f'];

            for (let i = 0; i < numBarcos; i++) {
                let div = document.createElement('div');
                div.className = 'boat-wrapper';
                
                let leftPos = -(Math.random() * 40 + 20); 
                let bottomPos = Math.random() * 80 + 5; 
                let baseScale = 1 - (bottomPos / 100); 
                let scale = 0.2 + (baseScale * 0.7); 
                let color = paletaCores[Math.floor(Math.random() * paletaCores.length)];

                div.style.left = `${leftPos}vw`;
                div.style.bottom = `${bottomPos}%`;
                div.style.transform = `translateX(-50%) scale(${scale})`;
                div.style.zIndex = Math.floor(scale * 10);
                
                div.innerHTML = `
                <div class="boat-bobbing" style="animation-delay: -${Math.random()*4}s; width: 140px;">
                    <svg viewBox="0 0 200 60" width="100%" height="100%">
                        <path d="M25,20 L160,20 L195,8 L170,40 L35,40 Z" fill="${color}"/> 
                        <rect x="15" y="10" width="20" height="25" fill="#334155" rx="2"/>
                    </svg>
                </div>`;
                
                fleetContainer.appendChild(div);

                setTimeout(() => {
                    div.style.transition = `left ${Math.random() * 20 + 15}s linear`; 
                    div.style.left = '120vw'; 
                }, 50);
            }
        }
    </script>
</body>
</html>
